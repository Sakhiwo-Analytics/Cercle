services:
  # Frontend Web Service
  - type: web
    name: cercle-frontend-staging
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_SUPABASE_URL
        sync: false
      - key: REACT_APP_SUPABASE_ANON_KEY
        sync: false
      - key: REACT_APP_API_URL
        value: https://cercle-api-staging.onrender.com
      - key: REACT_APP_AI_API_URL
        value: https://cercle-ai-staging.onrender.com

  # Node.js Backend Service
  - type: web
    name: cercle-api-staging
    env: node
    buildCommand: cd backend/node-services && npm ci
    startCommand: cd backend/node-services && npm start
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 8000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: REDIS_URL
        sync: false

  # Python FastAPI Service
  - type: web
    name: cercle-ai-staging
    env: python
    buildCommand: cd backend/python-services && pip install -r requirements.txt
    startCommand: cd backend/python-services && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: PORT
        value: 8001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
